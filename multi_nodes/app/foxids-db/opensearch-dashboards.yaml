# https://github.com/opensearch-project/helm-charts/tree/main/charts/opensearch-dashboards
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opensearch-dashboards
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://opensearch-project.github.io/helm-charts/'
    chart: opensearch-dashboards
    targetRevision: 3.2.2
    helm:
      releaseName: foxids-opensearch-dashboards
      valuesObject:
        replicaCount: 1
        opensearchHosts: "https://foxids-opensearch-master.foxids.svc.cluster.local:9200"
        extraEnvs:
          - name: OPENSEARCH_USERNAME
            value: admin
          - name: OPENSEARCH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: opensearch-secret
                key: opensearch-password
        config:
          opensearch_dashboards.yml: |
            server.host: "0.0.0.0"
            server.publicBaseUrl: "https://opensearch.test-multi-nodes.foxids.com"
            opensearch.hosts:
              - https://foxids-opensearch-master.foxids.svc.cluster.local:9200
            opensearch.username: "${OPENSEARCH_USERNAME}"
            opensearch.password: "${OPENSEARCH_PASSWORD}"
            opensearch.ssl.verificationMode: none
        resources:
          requests:
            cpu: "150m"
            memory: "384Mi"
          limits:
            cpu: "300m"
            memory: "512Mi"
        ingress:
          enabled: true
          ingressClassName: nginx
          annotations:
            cert-manager.io/cluster-issuer: "letsencrypt"
          hosts:
            - host: opensearch.test-multi-nodes.foxids.com
              paths:
                - path: /
                  backend:
                    servicePort: 5601
          tls:
            - secretName: opensearch-foxids-tls
              hosts:
                - opensearch.test-multi-nodes.foxids.com
  destination:
    name: in-cluster
    namespace: foxids
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
