# https://artifacthub.io/packages/helm/bitnami/opensearch 
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opensearch
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'registry-1.docker.io/bitnamicharts'
    chart: opensearch
    targetRevision: 2.0.3
    helm:
      valuesObject:
        global:
          # OVHcloud-specific storage class overrides (uncomment one if required)
          #defaultStorageClass: csi-cinder-high-speed-gen2
          #defaultStorageClass: csi-cinder-high-speed
        master:
          replicaCount: 2
          persistence:
            size: 22Gi
          # resources:
          #   limits:
          #     cpu: "750m"
          #     memory: "768Mi"
          #   requests:
          #     cpu: "500m"
          #     memory: "512Mi"
          metrics:
            enabled: true
          networkPolicy:
            #enabled: false
            extraIngress:
              - ports:
                  - port: 15008 # Support Istio Ambient on port 15008
        data: 
          replicaCount: 2
          persistence:
            size: 23Gi
          # resources:
          #   limits:
          #     cpu: "750m"
          #     memory: "1536Mi"
          #   requests:
          #     cpu: "500m"
          #     memory: "1024Mi"
          metrics:
            enabled: true
          networkPolicy:
            #enabled: false
            extraIngress:
              - ports:
                  - port: 15008 # Support Istio Ambient on port 15008
        coordinating: 
          replicaCount: 2
          # resources:
          #   limits:
          #     cpu: "750m"
          #     memory: "768Mi"
          #   requests:
          #     cpu: "500m"
          #     memory: "512Mi"
          metrics:
            enabled: true
          networkPolicy:
            #enabled: false
            extraIngress:
              - ports:
                  - port: 15008 # Support Istio Ambient on port 15008
        ingest: 
          replicaCount: 2
        #  tls: true
        #  selfSigned: true
          # resources:
          #   limits:
          #     cpu: "750m"
          #     memory: "768Mi"
          #   requests:
          #     cpu: "500m"
          #     memory: "512Mi"
          metrics:
            enabled: true
          networkPolicy:
            #enabled: false
            extraIngress:
              - ports:
                  - port: 15008 # Support Istio Ambient on port 15008
        dashboards:
          enabled: true
          replicaCount: 1
          # tls:
          #  enabled: true
          #  autoGenerated: true
          ingress:
            enabled: true
            hostname: "opensearch.test-multi-nodes.foxids.com"
            annotations: 
              #nginx.ingress.kubernetes.io/whitelist-source-range: "xxx.xxx.xxx.xxx" # Optional: restrict dashboard access to a source IP/CIDR
              cert-manager.io/cluster-issuer: "letsencrypt" 
              # nginx.ingress.kubernetes.io/secure-backends: "true"   # Uncomment if terminating TLS at OpenSearch Dashboards
              # nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
            tls: true
            ingressClassName: nginx
          # resources:
          #   limits:
          #     cpu: "750m"
          #     memory: "768Mi"
          #   requests:
          #     cpu: "500m"
          #     memory: "512Mi"
          networkPolicy:
            #enabled: false
            extraIngress:
              - ports:
                  - port: 15008 # Support Istio Ambient on port 15008
        security:
          enabled: true
          existingSecret: opensearch-secret  # Must contain: opensearch-password
          tls:
            autoGenerated: true
            restEncryption: true
            verificationMode: "certificate"
  destination:
    name: in-cluster
    namespace: foxids
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true