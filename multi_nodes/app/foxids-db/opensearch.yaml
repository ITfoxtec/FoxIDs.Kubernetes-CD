# https://artifacthub.io/packages/helm/bitnami/opensearch 
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opensearch
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'registry-1.docker.io/bitnamicharts'
    chart: opensearch
    targetRevision: 2.0.3
    helm:
      valuesObject:
        master:
          replicaCount: 2
          persistence:
            size: 24Gi
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "750m"
              memory: "768Mi"
          javaOpts: "-Xms512m -Xmx512m"
          metrics:
            enabled: true
        data: 
          replicaCount: 2
          persistence:
            size: 24Gi
          resources:                # FIX: moved requests/limits here (were incorrectly under persistence)
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          javaOpts: "-Xms1g -Xmx1g"  # Align heap to request to prevent swapping / OOM
          metrics:
            enabled: true
        coordinating: 
          replicaCount: 2
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "750m"
              memory: "768Mi"
          javaOpts: "-Xms512m -Xmx512m"
          metrics:
            enabled: true
        ingest: 
          replicaCount: 2
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "750m"
              memory: "768Mi"
          javaOpts: "-Xms512m -Xmx512m"
          metrics:
            enabled: true
        dashboards:
          enabled: true
          replicaCount: 1
          # tls:
          #  enabled: true
          #  autoGenerated: true
          ingress:
            enabled: true
            hostname: "opensearch.test-multi-nodes.foxids.com"
            annotations: 
              #nginx.ingress.kubernetes.io/whitelist-source-range: "xxx.xxx.xxx.xxx" # Optional: restrict dashboard access to a source IP/CIDR
              cert-manager.io/cluster-issuer: "letsencrypt" 
              # nginx.ingress.kubernetes.io/secure-backends: "true"   # Uncomment if terminating TLS at OpenSearch Dashboards
              # nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
            tls: true
            ingressClassName: nginx
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
        security:
          enabled: true
          existingSecret: opensearch-secret  # Must contain: opensearch-password
          tls:
            autoGenerated: true
            restEncryption: true
            verificationMode: "certificate"
  destination:
    name: in-cluster
    namespace: foxids
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true