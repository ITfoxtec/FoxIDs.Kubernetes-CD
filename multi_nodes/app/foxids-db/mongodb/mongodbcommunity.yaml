apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: mongodb
  namespace: foxids
  labels:
    app.kubernetes.io/name: foxids-mongodb
    app.kubernetes.io/part-of: foxids
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  members: 3
  type: ReplicaSet
  version: "7.0.12"
  security:
    authentication:
      modes:
        - SCRAM
  users:
    - name: root
      db: admin
      passwordSecretRef:
        name: mongodb-secret
        key: mongodb-root-password
      roles:
        - name: root
          db: admin
      scramCredentialsSecretName: mongodb-root-scram
      connectionStringSecretName: mongodb-admin-root
    - name: foxids
      db: FoxIDs
      passwordSecretRef:
        name: mongodb-secret
        key: mongodb-foxids-password
      roles:
        - name: readWrite
          db: FoxIDs
      scramCredentialsSecretName: mongodb-foxids-scram
      connectionStringSecretName: mongodb-foxids-foxids
      additionalConnectionStringConfig:
        authSource: FoxIDs
  additionalMongodConfig:
    replication:
      replSetName: mongodb
  statefulSet:
    spec:
      serviceName: mongodb-headless
      volumeClaimTemplates:
        - metadata:
            name: data-volume
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 16Gi
      template:
        metadata:
          labels:
            app.kubernetes.io/component: database
            app.kubernetes.io/name: mongodb
            app.kubernetes.io/instance: mongodb
        spec:
          containers:
            - name: mongod
              resources:
                requests:
                  cpu: "300m"
                  memory: "2Gi"
                limits:
                  cpu: "600m"
                  memory: "4Gi"
            - name: mongodb-agent
              resources:
                requests:
                  cpu: "150m"
                  memory: "256Mi"
                limits:
                  cpu: "300m"
                  memory: "384Mi"
