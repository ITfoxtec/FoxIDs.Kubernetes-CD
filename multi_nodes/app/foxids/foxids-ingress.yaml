apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: foxids-ingress-http
  annotations: 
   # Rate limiting (see: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#rate-limiting)
   nginx.ingress.kubernetes.io/limit-whitelist: "10.1.0.0/16"   # IPs/CIDRs excluded from rate limiting (internal network)
   nginx.ingress.kubernetes.io/limit-connections: "40"          # Max simultaneous connections per client IP
   nginx.ingress.kubernetes.io/limit-rpm: "600"                 # Requests per minute per client IP
   nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
   nginx.ingress.kubernetes.io/proxy-buffer-size: "32k"
   cert-manager.io/cluster-issuer: "letsencrypt"                # ACME ClusterIssuer for TLS
spec:	
  ingressClassName: nginx
  tls:
    - hosts:
      - id.test-multi-nodes.foxids.com
      - control.test-multi-nodes.foxids.com 
      secretName: foxids-tls
    
  rules:
  - host: control.test-multi-nodes.foxids.com 
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: foxids-control
            port:
              number: 8800
  - host: id.test-multi-nodes.foxids.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: foxids
            port:
              number: 8800