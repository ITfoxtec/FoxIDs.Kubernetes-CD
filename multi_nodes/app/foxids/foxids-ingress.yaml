apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: foxids-ingress-http
  annotations: 
   # Rate Limiting, docs https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#rate-limiting
   nginx.ingress.kubernetes.io/limit-whitelist: "10.1.0.0/16"   # Configure the internal network to be excluded from rate-limiting, you can specify a list of IPs or CIDRs to allow
   nginx.ingress.kubernetes.io/limit-connections: "40"          # Limit the number of connections per IP address
   nginx.ingress.kubernetes.io/limit-rpm: "600"                 # Limit the number of requests per minute per IP address
   nginx.ingress.kubernetes.io/limit-rps: "20"                  # Limit the number of requests per second per IP address
   nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
   nginx.ingress.kubernetes.io/proxy-buffer-size: "32k"
   cert-manager.io/cluster-issuer: "letsencrypt" 
spec:	
  ingressClassName: nginx
  tls:
    - hosts:
      - id.test-multi-nodes.foxids.com
      - control.test-multi-nodes.foxids.com 
      secretName: foxids-tls
    
  rules:
  - host: control.test-multi-nodes.foxids.com 
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: foxids-control
            port:
              number: 8800
  - host: id.test-multi-nodes.foxids.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: foxids
            port:
              number: 8800