apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: foxids
  namespace: argocd
  annotations:
    argocd.argoproj.io/hook: "PostSync"
spec:
  project: default
  source:
    repoURL: https://github.com/ITfoxtec/FoxIDs.Kubernetes-CD.git
    targetRevision: main
    path: multi_nodes/app/foxids
    directory:
      exclude: application.yaml
  destination:
    name: in-cluster
    namespace: foxids
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      