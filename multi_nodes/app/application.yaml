apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: application
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - path: multi_nodes/app/argocd
    repoURL: https://github.com/ITfoxtec/FoxIDs.Kubernetes-CD.git
    targetRevision: main
    directory:
      include: application.yaml

  - path: multi_nodes/app/cert-manager
    repoURL: https://github.com/ITfoxtec/FoxIDs.Kubernetes-CD.git
    targetRevision: main
  - path: multi_nodes/app/cluster-issuer
    repoURL: https://github.com/ITfoxtec/FoxIDs.Kubernetes-CD.git
    targetRevision: main
    directory:
      include: application.yaml
  - path: multi_nodes/app/ingress
    repoURL: https://github.com/ITfoxtec/FoxIDs.Kubernetes-CD.git
    targetRevision: main

  - path: multi_nodes/app/foxids-db
    repoURL: https://github.com/ITfoxtec/FoxIDs.Kubernetes-CD.git
    targetRevision: main
  - path: multi_nodes/app/foxids
    repoURL: https://github.com/ITfoxtec/FoxIDs.Kubernetes-CD.git
    targetRevision: main
    directory:
     include: application.yaml
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true